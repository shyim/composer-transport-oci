<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Composer packages. OCI registries.</title>
  <desc id="description">Publish PHP packages with ORAS and install them with Composer, using an OCI registry such as GHCR.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#242047"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="62" y="66" fill="#a5b4fc" font-size="15" font-weight="700" letter-spacing="3">COMPOSER TRANSPORT OCI</text>
    <text x="60" y="139" fill="#f8fafc" font-size="48" font-weight="750">Composer packages.</text>
    <text x="60" y="198" fill="url(#accent)" font-size="48" font-weight="750">OCI registries.</text>
    <text x="62" y="250" fill="#cbd5e1" font-size="20">Publish with ORAS. Install with Composer.</text>
    <text x="62" y="286" fill="#94a3b8" font-size="16">Your PHP packages, in the registry you already use.</text>
    <g transform="translate(790 78)">
      <rect width="320" height="200" rx="16" fill="#0f172a" stroke="#64748b" stroke-opacity=".5"/>
      <circle cx="24" cy="24" r="4" fill="#a78bfa"/><circle cx="40" cy="24" r="4" fill="#67e8f9"/><circle cx="56" cy="24" r="4" fill="#64748b"/>
      <text x="24" y="72" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">oci://ghcr.io/acme/library</text>
      <path d="M24 92h272" stroke="#334155"/>
      <g fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
        <text x="24" y="124">composer.json</text><text x="232" y="124" fill="#67e8f9">config</text>
        <text x="24" y="155">package.zip</text><text x="240" y="155" fill="#67e8f9">layer</text>
        <text x="24" y="183" fill="#94a3b8">sha256: immutable downloads</text>
      </g>
    </g>
  </g>
</svg>
